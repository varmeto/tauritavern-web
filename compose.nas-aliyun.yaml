version: "3.8"

services:
  app:
    image: crpi-r6vmfx1s6cdrwjcm.cn-beijing.personal.cr.aliyuncs.com/varmeto/tauritavern-web-app:2.3.0-v1.2-arm64
    restart: unless-stopped
    environment:
      PORT: "3093"
      TT_DATA_DIR: /data
      TT_IMPORT_DIR: /imports
    volumes:
      - ./data:/data
      - ./imports:/imports:ro

  gateway:
    image: crpi-r6vmfx1s6cdrwjcm.cn-beijing.personal.cr.aliyuncs.com/varmeto/tauritavern-web-gateway:2.3.0-v1.2-arm64
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PORT: "8080"
      TT_BACKEND_URL: http://app:3093
      TT_WEB_PASSWORD: CHANGE_ME
    ports:
      - "40377:8080"
