name: Web container build

on:
  pull_request:
    paths:
      - ".github/workflows/web-container-build.yml"
      - "compose.yaml"
      - "DOCKER-WEB.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rspack.config.js"
      - "src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/crates/**"
      - "default/content/settings.json"
      - "default/content/presets/**"
      - "web/**"
      - "tests/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Test browser-host persistence and imports
        run: node --test tests/web/app-server-smoke.test.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build Rust web host for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/app-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
