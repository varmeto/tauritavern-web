name: Web container build

on:
  pull_request:
    paths:
      - ".github/workflows/web-container-build.yml"
      - "compose.yaml"
      - "DOCKER-WEB.md"
      - "UPGRADE-WEB.md"
      - "CHANGELOG-WEB.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rspack.config.js"
      - "src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/crates/**"
      - "default/content/settings.json"
      - "default/content/presets/**"
      - "web/**"
      - "scripts/build-web-manifest.mjs"
      - "scripts/package-web-release.ps1"
      - "tests/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate && pnpm install --frozen-lockfile
      - name: Check frontend, contracts, Rust and browser host
        run: pnpm run check && pnpm run web:gateway:test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            TT_WEB_ADAPTER_COMMIT=${{ github.sha }}
          outputs: type=oci,dest=/tmp/tt-web-gateway.oci.tar
      - name: Build Rust web host for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/app-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/tt-web-app.oci.tar
      - name: Keep candidate images for browser and NAS acceptance
        uses: actions/upload-artifact@v4
        with:
          name: tt-web-candidate-${{ github.sha }}
          path: |
            /tmp/tt-web-gateway.oci.tar
            /tmp/tt-web-app.oci.tar
          retention-days: 14
